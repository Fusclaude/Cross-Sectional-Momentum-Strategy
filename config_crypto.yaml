factors:
  weeks_per_month: 4.345
  # Equity momentum skips the latest month because of 1-month reversal. In
  # crypto that reversal is weak and the signal lives at 1-8 week horizons
  # (Liu, Tsyvinski & Wu 2022), so the default is NO skip. Raising this is a
  # new research configuration and should bump evaluation.n_trials.
  skip_weeks: 0
  winsor_sigma: 3.0

# Default blend for the Python reference book and the backtest. The dashboard
# opens with these and lets you move them; any blend you settle on after
# looking at results is another trial -- record it in n_trials.
default_weights:
  m1: 15      # 4-week return
  m2: 20      # 8-week return
  m3: 20      # 13-week return
  m6: 15      # 26-week return
  q2: 5       # R² of log-trend, 8 weeks
  q3: 5       # R² of log-trend, 13 weeks
  q6: 5       # R² of log-trend, 26 weeks
  vadj: 15    # 13-week return / 13-week volatility

regime:
  # Crypto cross-sections are dominated by BTC beta: in a BTC bear market the
  # best-ranked coin usually still loses money. The rule: hold the book only
  # while BTC's weekly close is above its N-week simple moving average, cash
  # otherwise. Evaluated at the same close the book is formed on -- no peek.
  enabled: true
  asset: BTC-USD
  sma_weeks: 20

evaluation:
  forward_horizons_weeks: [1, 4, 13]
  n_buckets: 5              # quintiles: a 50-coin universe is too thin for deciles
  newey_west_lags: 4
  min_names: 20             # skip cross-sections thinner than this
  # Configurations evaluated by run_crypto.py (8 single-factor books + the
  # default blend, each with and without the regime filter = 18), plus
  # anything you tried by hand. Never lower it.
  n_trials: 18

portfolio:
  top_n: 5
  rebalance_weeks: 4
  # Charged per unit of one-way turnover (sum |Δw| counts both legs).
  # ~10 bps taker fee + ~20 bps spread/slippage on a top-50 coin. Majors are
  # cheaper, small caps much dearer -- this is a deliberately middling guess.
  one_way_cost_bps: 30

dashboard:
  history_weeks: 52         # weeks of factor history shipped for the rank grid
  chart_weeks: 104
