# ─────────────────────────────────────────────────────────────────────────────
# config_crypto.yaml — single source of truth for the CRYPTO sleeve.
#
# Kept separate from config.yaml on purpose: the equity manifest hash, trial
# count and analytics stay untouched by anything done here, and the crypto
# sleeve can be retuned (or deleted) without invalidating a single equity
# result. Each run records the SHA-256 of THIS file in crypto_signals.json.
# ─────────────────────────────────────────────────────────────────────────────
schema_version: 1

data:
  # BTC/ETH history on Yahoo starts 2014/2017; most alts 2017-2021. Starting in
  # 2017 keeps the earliest cross-sections from being a 5-coin universe.
  start: "2017-01-01"
  # Crypto trades 24/7. Weeks end at the Sunday 00:00 UTC daily bar's close
  # (i.e. Sunday 23:59 UTC). The fetch drops the in-progress day and any
  # incomplete final week, so a run at any time only ever sees closed weeks.
  resample: W-SUN
  # Yahoo reports crypto volume in USD (quote currency), not coins. The fetch
  # auto-detects this from BTC's volume scale and records which it used;
  # "auto" is the right setting unless that detection is ever wrong.
  volume_units: auto           # auto | usd | coins

quality:
  # Latest closed weekly bar must be at most this old (days) at run time.
  max_staleness_days: 9
  # These must be present and current, or the run fails. Everything else may
  # be missing — delisted/renamed coins are expected in a survivorship-aware
  # candidate list and are reported, not fatal.
  required: [BTC-USD, ETH-USD]
  # Fail if fewer than this many coins are investable at the latest week.
  min_universe: 20
  # Weekly moves this large are reported as warnings, never failures. Crypto
  # genuinely does +300% / -90% weeks (LUNA, FTT). A split-style gate like the
  # equity one would fire every month here.
  extreme_week_warn: 2.0

universe:
  # Point-in-time liquidity universe, rebuilt EVERY WEEK from data available
  # that week: the top N coins by trailing median daily dollar volume.
  # Membership is never taken from today's market-cap table — that is the
  # single biggest source of survivorship bias in crypto backtests.
  size: 50
  dollar_volume_weeks: 13       # trailing window for the liquidity ranking
  min_daily_dollar_volume: 5000000
  min_history_weeks: 30         # seasoning: covers the 26w lookback + buffer
  min_price: 0.0                # meme coins legitimately trade at 1e-5
  # Stablecoins / pegged / wrapped assets are removed by name AND by a
  # behavioural test (price near 1.0 with near-zero volatility), so a new
  # stablecoin added to the list below is caught even if not named here.
  exclude:
    - USDT-USD
    - USDC-USD
    - DAI-USD
    - BUSD-USD
    - TUSD-USD
    - USDP-USD
    - UST-USD
    - USTC-USD
    - FDUSD-USD
    - PYUSD-USD
    - USDE-USD
    - USDD-USD
    - FRAX-USD
    - GUSD-USD
    - WBTC-USD
    - WETH-USD
    - STETH-USD
    - WSTETH-USD
    - PAXG-USD
    - XAUT-USD
  stablecoin_test:
    weeks: 26
    max_abs_deviation_from_1: 0.05
    max_annual_vol: 0.10

  # Candidate list. Deliberately includes coins that were large and then
  # collapsed or faded (LUNC/Terra, FTT, CEL, EOS, NEO, XEM, BSV, WAVES ...).
  # They were in the investable top-50 at the time, so a backtest that
  # leaves them out is testing a universe nobody could have known in
  # advance. Tickers Yahoo no longer serves are logged and skipped.
  #
  # CAVEAT: the list itself was written in 2026, so which DEAD coins made it
  # onto it is still a hindsight choice. The liquidity ranking removes most
  # of the bias, not all of it. Add any delisted coin you remember being big.
  #
  # category is informational (shown on the dashboard); the crypto composite
  # is NOT category-neutralised — categories are subjective and too thin.
  candidates:
    BTC-USD: {name: Bitcoin, category: Store of value}
    ETH-USD: {name: Ethereum, category: Layer 1}
    BNB-USD: {name: BNB, category: Exchange}
    XRP-USD: {name: XRP, category: Payments}
